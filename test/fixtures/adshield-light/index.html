<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pending</title>
</head>
<body>
<script>
(() => {
  const nonce = String(Math.random());
  let answered = false;
  addEventListener("message", (event) => {
    if (event.data === nonce + "_as_res") answered = true;
  });
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const loader = document.createElement("script");
  loader.src = new URLSearchParams(location.search).get("src") || "https://html-load.com/loader.min.js";
  loader.onerror = () => { document.title = "fail: load"; };
  loader.onload = async () => {
    for (const delay of [0, 100, 500, 1000]) {
      await wait(delay);
      postMessage(nonce + "_as_req", "*");
      await wait(50);
      if (answered) {
        document.title = "ok";
        return;
      }
    }
    document.title = "fail: handshake";
  };
  document.head.appendChild(loader);
})();
</script>
</body>
</html>
