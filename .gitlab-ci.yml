stages:
  - lint
  - test
  - build
  - push
  - pages

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

default:
  tags: [homelab]

include:
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/base@0.23.0
    inputs:
      runner_tags:
        - homelab
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/pre-commit@0.23.0
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/security@0.23.0
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/alint-fix@0.23.0
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/go@0.23.0
    inputs:
      go_image: golang:1.23
      publish_tags: false
    rules:
      - if: $CI_COMMIT_BRANCH
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/container-build@0.23.0
    inputs:
      needs: ['go:build']
    rules:
      - if: $CI_COMMIT_BRANCH
      - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/copy-image@0.23.0
    inputs:
      job_suffix: ":sha"
      to_image_tag: $CI_COMMIT_SHORT_SHA
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/copy-image@0.23.0
    inputs:
      job_suffix: ":latest"
      to_image_tag: latest
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/copy-image@0.23.0
    inputs:
      job_suffix: ":tag"
      from_image_tag: $CI_COMMIT_REF_SLUG
      to_image_tag: $CI_COMMIT_TAG
    rules:
      - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/container-tag@0.23.0
    inputs:
      prefix: "ghcr:"
      stage: push
      to_image: ghcr.io/ptrck-sh/adblock-recovery-sink
      dest_registry: ghcr.io
      dest_username: pulsar501
      dest_password: $GH_TOKEN_CLASSIC
      needs_latest:
        - job: container:build
          optional: true
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/container-tag@0.23.0
    inputs:
      prefix: "dockerhub:"
      stage: push
      to_image: docker.io/ptrcksh/adblock-recovery-sink
      dest_registry: docker.io
      dest_username: $DOCKERHUB_USERNAME
      dest_password: $DOCKERHUB_TOKEN
      needs_latest:
        - job: container:build
          optional: true
  - component: $CI_SERVER_FQDN/ptrck-sh/templates/ci-templates/container-tag@0.23.0
    inputs:
      prefix: "quay:"
      stage: push
      to_image: quay.io/ptrck-sh/adblock-recovery-sink
      dest_registry: quay.io
      dest_username: $QUAY_USERNAME
      dest_password: $QUAY_TOKEN
      needs_latest:
        - job: container:build
          optional: true

go:build:
  stage: build
  image:
    name: goreleaser/goreleaser:v2.18.2
    entrypoint: [""]
  tags: [saas-linux-medium-amd64]
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
    GIT_DEPTH: 0
  script:
    - goreleaser release --snapshot --clean --config .goreleaser.yml
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/

pages:
  stage: pages
  needs: []
  image: docker.io/library/debian:bookworm-slim
  variables:
    ZOLA_VERSION: "0.22.1"
  before_script:
    - apt-get update
    - apt-get install --no-install-recommends --yes ca-certificates curl tar
    - curl --location --fail --output /tmp/zola.tar.gz "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
    - tar -xzf /tmp/zola.tar.gz -C /usr/local/bin zola
  script:
    - zola --root site build --output-dir public
  artifacts:
    paths: [public]
  pages: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docs:build:
  stage: pages
  image: docker.io/library/debian:bookworm-slim
  variables:
    ZOLA_VERSION: "0.22.1"
  before_script:
    - apt-get update
    - apt-get install --no-install-recommends --yes ca-certificates curl tar
    - curl --location --fail --output /tmp/zola.tar.gz "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
    - tar -xzf /tmp/zola.tar.gz -C /usr/local/bin zola
  script:
    - zola --root site build --output-dir public
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

ghcr:container:tag:gittag:
  needs:
    - job: container:build
      optional: true
  script:
    - skopeo copy --all docker://"$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" docker://"ghcr.io/ptrck-sh/adblock-recovery-sink:$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/

dockerhub:container:tag:gittag:
  needs:
    - job: container:build
      optional: true
  script:
    - skopeo copy --all docker://"$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" docker://"docker.io/ptrcksh/adblock-recovery-sink:$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/

quay:container:tag:gittag:
  needs:
    - job: container:build
      optional: true
  script:
    - skopeo copy --all docker://"$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" docker://"quay.io/ptrck-sh/adblock-recovery-sink:$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/
